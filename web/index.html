<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Fluxa Console</title>
    <script>
      // Resolve the theme before first paint so a dark-mode operator never
      // gets a white flash on reload. Mirrors the logic in
      // src/components/theme-provider.tsx; keep the storage key in sync.
      (function () {
        try {
          var stored = localStorage.getItem("fluxa-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          /* private mode or storage disabled — fall back to the dark default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
