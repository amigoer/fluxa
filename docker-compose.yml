services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: fluxa
      POSTGRES_DB: fluxa
    ports:
      - "5432:5432"
    volumes:
      - fluxa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fluxa-postgres-data:
