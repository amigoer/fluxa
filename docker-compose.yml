services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxa}
      POSTGRES_DB: ${POSTGRES_DB:-fluxa}
    volumes:
      - fluxa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxa} -d ${POSTGRES_DB:-fluxa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fluxa:
    image: fluxa/fluxa:latest
    build: .
    container_name: fluxa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Fluxa keeps every provider, route and key in Postgres; the
      # connection below is the only configuration it needs to boot.
      # Schema migrations run automatically on startup.
      FLUXA_DB_HOST: postgres
      FLUXA_DB_PORT: 5432
      FLUXA_DB_USER: ${POSTGRES_USER:-fluxa}
      FLUXA_DB_PASSWORD: ${POSTGRES_PASSWORD:-fluxa}
      FLUXA_DB_NAME: ${POSTGRES_DB:-fluxa}
      FLUXA_DB_SSLMODE: disable
      # First-run admin account for the /admin API. Change the password
      # immediately after the first login.
      FLUXA_BOOTSTRAP_USER: ${FLUXA_BOOTSTRAP_USER:-admin}
      FLUXA_BOOTSTRAP_PASSWORD: ${FLUXA_BOOTSTRAP_PASSWORD:-admin}
    volumes:
      - fluxa-data:/app/data
    healthcheck:
      test: ["CMD", "/app/fluxa", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fluxa-pgdata:
  fluxa-data:
